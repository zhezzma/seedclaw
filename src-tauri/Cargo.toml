[package]
name = "seedclaw"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "seedclaw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
url = "2.5"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"



# WebSocket 使用 native-tls (在 Windows/Linux 上使用系统 SSL，Android 上我们需要手动编译 OpenSSL)
# 当收到消息时，插件内部的代码逻辑是写死的——它会立即把消息通过 IPC 通道发送给前端 WebView。
# 除非你把这个插件的源码下载下来，修改它的 Rust 代码（Fork），否则你无法在它收到消息的那一刻，插入一句 show_notification()。
# 所以如果处理通知要在rust层使用tungstenite
tauri-plugin-websocket = { version = "2", default-features = false, features = ["native-tls"] }
# Android 平台特有配置：强制编译 OpenSSL (vendored)，因为 Android 系统不提供标准 OpenSSL 库
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"

