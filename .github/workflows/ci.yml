name: SeedClaw Seedagent Latest Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: seedagent-build-latest
  cancel-in-progress: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete seedagent-build-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      - name: Create latest prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create seedagent-build-latest \
            --repo "$GITHUB_REPOSITORY" \
            --target ${{ github.sha }} \
            --title "SeedClaw Seedagent Latest Build" \
            --notes "Automated latest build for seedagent at ${{ github.sha }}" \
            --prerelease

  publish-web:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Type check
        run: npm run tcs

      - name: Build web
        run: npm run build

      - name: Archive web build
        run: tar -czf seedclaw-web-dist.tar.gz dist

      - name: Upload web build to latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: seedagent-build-latest
          files: seedclaw-web-dist.tar.gz
          draft: false
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true

  publish-desktop:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            bundleServer: false
          - platform: "ubuntu-22.04"
            args: ""
            bundleServer: false
          # Windows 双版本并行构建：无 server（纯客户端）与含 server（内置服务端）
          # 含 server 版经构建时生成的 overlay（见 Stage bundled server 步骤）改
          # productName（SeedClaw Server → 安装包名不同，不与无 server 版在
          # Release 里互相覆盖）与 identifier（独立数据目录/单实例锁，两版可并存安装）
          - platform: "windows-latest"
            args: ""
            bundleServer: false
          - platform: "windows-latest"
            args: ""
            bundleServer: true

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          # 含 server 腿用 23：seedagent 构建要求 Node 23（原生模块 ABI 锁主版本），
          # 且打包脚本按主版本匹配直接拷贝 runner 的 node.exe 作为内置运行时
          node-version: ${{ matrix.bundleServer && '23' || '20' }}
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # ── 内置服务端（bundleServer 腿）──────────────────────────────
      # GITHUB_TOKEN 只对 seedclaw 本仓库有权限，同账号也不行；
      # 跨仓库克隆私有 seedagent 需要 PAT secret：SEEDAGENT_TOKEN
      # （fine-grained PAT，对 zhezzma/seedagent 授予 Contents: Read-only）
      - name: Checkout seedagent (bundled server source)
        if: matrix.bundleServer
        uses: actions/checkout@v5
        with:
          repository: zhezzma/seedagent
          ref: main
          path: seedagent
          token: ${{ secrets.SEEDAGENT_TOKEN }}

      # 装配：构建 seedagent → 采集 node.exe → 填充 src-tauri/resources/seedagent/，
      # 并生成发布版 overlay（仅本腿、构建时生成，不落仓库）：Server Edition
      # 身份 + 服务端 resources glob。不含 server 的构建没有这份资源 →
      # bundled=false → 网关强制远程模式，属预期降级
      - name: Stage bundled server
        if: matrix.bundleServer
        shell: pwsh
        run: |
          ./scripts/package-desktop.ps1 -StageOnly -SeedagentDir "$env:GITHUB_WORKSPACE/seedagent"
          @{
            productName = "SeedClaw Server"
            identifier = "com.godgodgame.seedclaw.server"
            bundle = @{ resources = @("resources/seedagent/**/*") }
          } | ConvertTo-Json -Depth 3 | Set-Content -Path "src-tauri/tauri.server-edition.conf.json" -Encoding utf8NoBOM

      - name: Build Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=6144"
        with:
          tagName: seedagent-build-latest
          releaseName: "SeedClaw Seedagent Latest Build"
          releaseBody: "Automated latest desktop build for seedagent at ${{ github.sha }}"
          releaseDraft: false
          prerelease: true
          # 含 server 版叠加 productName/identifier 补丁，安装包名与无 server 版区分
          args: ${{ matrix.args }}${{ matrix.bundleServer && ' --config src-tauri/tauri.server-edition.conf.json' || '' }}

      # 便携版：含 server 版必须带上 resources（node_modules 深路径超 260 字符，
      # 用 robocopy 拷贝 + bsdtar 压缩，与 package-desktop.ps1 同策略）；
      # 无 server 版保持仅 exe。zip 名按版本区分，避免同 Release 互相覆盖
      - name: Package Windows portable build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          BUNDLE_SERVER: ${{ matrix.bundleServer }}
        run: |
          $suffix = if ($env:BUNDLE_SERVER -eq 'true') { '-server' } else { '' }
          $zipName = "seedclaw${suffix}-windows-portable-x64.zip"
          $portableDir = "portable-bundle"
          if (Test-Path $portableDir) { Remove-Item -Recurse -Force $portableDir }
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "src-tauri/target/release/seedclaw.exe" $portableDir
          if ($env:BUNDLE_SERVER -eq 'true') {
            robocopy "src-tauri/resources" "$portableDir/resources" /E /NFL /NDL /NJH /NJS | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "robocopy resources failed (exit $LASTEXITCODE)" }
            tar -a -c -f $zipName -C $portableDir seedclaw.exe resources
          } else {
            tar -a -c -f $zipName -C $portableDir seedclaw.exe
          }
          Get-Item $zipName | Format-List FullName, Length

      - name: Upload Artifacts
        uses: softprops/action-gh-release@v3
        with:
          tag_name: seedagent-build-latest
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            seedclaw-windows-portable-x64.zip
            seedclaw-server-windows-portable-x64.zip
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sig
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          draft: false
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: false

  publish-android:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: install java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: setup android-sdk
        uses: android-actions/setup-android@v3

      - name: Configure Android NDK & OpenSSL Env
        run: |
          sdkmanager "ndk;26.1.10909125"
          NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          NDK_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "$NDK_BIN" >> $GITHUB_PATH

          CLANG="$NDK_BIN/aarch64-linux-android24-clang"
          echo "CC_aarch64_linux_android=$CLANG" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG" >> $GITHUB_ENV
          echo "OPENSSL_NO_PKG_CONFIG=1" >> $GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $GITHUB_ENV

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: install frontend dependencies
        run: npm ci
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Patch Android Maven repositories for CI
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/android/build.gradle.kts")
          text = path.read_text()

          original = text
          lines = []
          for line in text.splitlines():
              if "maven.aliyun.com" in line:
                  continue
              lines.append(line)

          new_text = "\n".join(lines) + "\n"
          path.write_text(new_text)

          print(f"=== Patched: {path} ===")
          print(new_text)
          if original == new_text:
              print("No aliyun repository lines found.")
          PY

      - name: Decode Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > src-tauri/gen/android/keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: build android release apk
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PATH: ../keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          npx tauri android build --target aarch64

      - name: build android debug apk
        run: |
          npx tauri android build --debug --target aarch64
          echo "Listing build artifacts:"
          find src-tauri/gen/android -name "*.apk"

      - name: upload apk to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: seedagent-build-latest
          files: |
            src-tauri/gen/android/app/build/outputs/apk/release/app-release.apk
            src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
            src-tauri/gen/android/**/*.apk
          draft: false
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: false
