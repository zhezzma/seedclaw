name: "Publish Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release"
        required: true
        default: "v0.0.1-manual"

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          name: "SeedClaw ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}"
          body: "Automated release for ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}"
          draft: false
          prerelease: false

  publish-desktop:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm ci
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Build Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          args: ${{ matrix.args }}

      - name: Upload Artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg.sig
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

  publish-android:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: setup android-sdk
        uses: android-actions/setup-android@v3

      - name: Configure Android NDK & OpenSSL Env
        run: |
          sdkmanager "ndk;26.1.10909125"
          NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.1.10909125"
          NDK_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "$NDK_BIN" >> $GITHUB_PATH

          # Configure CC/AR for aarch64
          CLANG="$NDK_BIN/aarch64-linux-android24-clang"
          echo "CC_aarch64_linux_android=$CLANG" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$CLANG" >> $GITHUB_ENV

          # Force OpenSSL to build from source (ignoring pkg-config)
          echo "OPENSSL_NO_PKG_CONFIG=1" >> $GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $GITHUB_ENV

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: install frontend dependencies
        run: npm ci
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Patch Android Maven repositories for CI
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("src-tauri/gen/android/build.gradle.kts")
          text = path.read_text()

          original = text
          lines = []
          for line in text.splitlines():
              if "maven.aliyun.com" in line:
                  continue
              lines.append(line)

          new_text = "\n".join(lines) + "\n"
          path.write_text(new_text)

          print(f"=== Patched: {path} ===")
          print(new_text)
          if original == new_text:
              print("No aliyun repository lines found.")
          PY

      - name: Decode Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > src-tauri/gen/android/keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: build android release apk
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_PATH: ../keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          npx tauri android build --target aarch64

      - name: build android debug apk
        run: |
          npx tauri android build --debug --target aarch64
          echo "Listing build artifacts:"
          find src-tauri/gen/android -name "*.apk"

      - name: upload apk to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/gen/android/app/build/outputs/apk/release/app-release.apk
            src-tauri/gen/android/app/build/outputs/apk/debug/app-debug.apk
            src-tauri/gen/android/**/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
